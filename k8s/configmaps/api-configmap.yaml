apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: finance-tracker
  labels:
    app: finance-api
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  ASPNETCORE_URLS: "http://+:8080"
  ConnectionStrings__Redis: "redis-service:6379"
  # DefaultConnection is built in api-deployment.yaml (password from secret; K8s cannot expand $(VAR) in env values)
  Jwt__Issuer: "FinanceTracker"
  Jwt__Audience: "FinanceTrackerClient"
  Serilog__MinimumLevel__Default: "Information"
  Serilog__SeqUrl: "http://seq:80"
  OpenTelemetry__ServiceName: "finance-api"
  OpenTelemetry__OtlpEndpoint: "http://otel-collector:4317"
