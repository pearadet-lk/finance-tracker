apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-frontend
  namespace: finance-tracker
  labels:
    app: finance-frontend
    tier: frontend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: finance-frontend
        tier: frontend
        version: v1
    spec:
      containers:
        - name: finance-frontend
          image: finance-tracker/frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: finance-tracker
  labels:
    app: finance-frontend
spec:
  selector:
    app: finance-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
