apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: finance-tracker
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
      nodePort: 30686
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: agent-udp
      port: 6831
      targetPort: 6831
      protocol: UDP
