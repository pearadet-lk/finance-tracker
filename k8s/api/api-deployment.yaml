apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-api
  namespace: finance-tracker
  labels:
    app: finance-api
    tier: backend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finance-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0           # zero-downtime deploys
  template:
    metadata:
      labels:
        app: finance-api
        tier: backend
        version: v1
    spec:
      # Wait for DB + Redis before starting
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "Waiting for PostgreSQL..."; sleep 2;
              done
              echo "PostgreSQL is ready!"
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis-service 6379; do
                echo "Waiting for Redis..."; sleep 2;
              done
              echo "Redis is ready!"

      containers:
        - name: finance-api
          image: finance-tracker/api:local   # built into minikube's docker daemon
          imagePullPolicy: Never             # use local image — no registry needed
          # K8s does not substitute $(PORT) inside env value: — build conn string at start
          command: ["/bin/sh", "-c"]
          args:
            - |
              export ConnectionStrings__DefaultConnection="Host=postgres-service;Port=5432;Database=finance_tracker;Username=admin;Password=${POSTGRES_PASSWORD}"
              exec dotnet FinanceTracker.Api.dll
          ports:
            - containerPort: 8080
              name: http
          env:
            # From ConfigMap
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_URLS
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: ASPNETCORE_URLS
            - name: ConnectionStrings__Redis
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: ConnectionStrings__Redis
            - name: Jwt__Issuer
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: Jwt__Issuer
            - name: Jwt__Audience
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: Jwt__Audience
            - name: Serilog__MinimumLevel__Default
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: Serilog__MinimumLevel__Default
            - name: Serilog__SeqUrl
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: Serilog__SeqUrl
            - name: OpenTelemetry__ServiceName
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: OpenTelemetry__ServiceName
            - name: OpenTelemetry__OtlpEndpoint
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: OpenTelemetry__OtlpEndpoint

            # From Secrets
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finance-secrets
                  key: postgres-password
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: finance-secrets
                  key: jwt-secret

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

          # Graceful shutdown
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: finance-tracker
  labels:
    app: finance-api
spec:
  selector:
    app: finance-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
