version: "3.9"

# ─────────────────────────────────────────────
#  Finance — Local Development Docker Compose
#  Run: docker compose up --build
#  Frontend : http://localhost:5173
#  API      : http://localhost:5001
#  Swagger  : http://localhost:5001/swagger
#  pgAdmin  : http://localhost:5050
#  Redis UI : http://localhost:8081
#  Seq      : http://localhost:5341  (logging — same stack as k8s)
#  Jaeger   : http://localhost:16686 (tracing UI)
#  Prometheus: http://localhost:9090 (metrics)
#  Grafana  : http://localhost:3001 (admin/admin)
# ─────────────────────────────────────────────

services:

  # ── PostgreSQL ────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: finance_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finance_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d finance_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - finance_net

  # ── Redis ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: finance_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - finance_net

  # ── Seq (structured logs — k8s/observability/seq-*.yaml) ──
  seq:
    image: datalust/seq:latest
    container_name: finance_seq
    restart: unless-stopped
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "True"
    volumes:
      - seq_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - finance_net

  # ── Jaeger all-in-one (k8s/observability/jaeger-*.yaml) ──
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: finance_jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "6831:6831/udp"
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
      COLLECTOR_OTLP_ENABLED: "true"
      METRICS_STORAGE_TYPE: prometheus
      PROMETHEUS_SERVER_URL: http://prometheus:9090
      # Match OTel spanmetrics metric names in Prometheus (calls_total, duration_milliseconds_*)
      PROMETHEUS_QUERY_NORMALIZE_CALLS: "true"
      PROMETHEUS_QUERY_NORMALIZE_DURATION: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:16686/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - finance_net

  # ── OpenTelemetry Collector (traces -> Jaeger, spanmetrics -> Prometheus) ──
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: finance_otel_collector
    restart: unless-stopped
    command:
      - "--config=/etc/otelcol-contrib/config.yml"
    volumes:
      - ./docker/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:13133/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - finance_net

  # ── Prometheus (metrics — same stack as k8s) ──
  prometheus:
    image: prom/prometheus:latest
    container_name: finance_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      api:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - finance_net

  # ── Grafana (dashboards for Prometheus metrics) ──
  grafana:
    image: grafana/grafana-oss:latest
    container_name: finance_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - finance_net

  # ── .NET 10 API ───────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: finance_api
    restart: unless-stopped
    ports:
      - "5001:8080"
    labels:
      app: finance-api
      tier: backend
      version: v1
    environment:
      # Mirrors k8s configmaps/api-configmap.yaml + secrets (local values match k8s/secrets.yaml)
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=finance_tracker;Username=admin;Password=password
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Secret=local-dev-secret-key-change-in-prod-32chars!!
      - Jwt__Issuer=FinanceTracker
      - Jwt__Audience=FinanceTrackerClient
      - Serilog__MinimumLevel__Default=Information
      - Serilog__SeqUrl=http://seq:80
      - OpenTelemetry__ServiceName=finance-api
      - OpenTelemetry__OtlpEndpoint=http://otel-collector:4317
    volumes:
      - ./backend:/app                          # mount source for hot reload
      - dotnet_cache:/root/.nuget/packages      # cache NuGet packages
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seq:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - finance_net

  # ── React Frontend (Vite dev server) ──────
  #  k8s serves production nginx:80; locally Vite :5173 with API URL to host-mapped API.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: finance_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    labels:
      app: finance-frontend
      tier: frontend
      version: v1
    environment:
      - VITE_API_URL=http://localhost:5001/api
    volumes:
      - ./frontend:/app                         # mount source for hot reload
      - node_modules_cache:/app/node_modules    # cache node_modules in volume
    depends_on:
      api:
        condition: service_healthy
    # No deploy.resources here: k8s frontend is nginx (small); Vite dev needs more RAM than k8s limits.
    networks:
      - finance_net

  # ── pgAdmin (DB GUI) ──────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finance_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - finance_net
    profiles:
      - tools                                   # only starts with: docker compose --profile tools up

  # ── Redis Commander (Redis GUI) ───────────
  redis_ui:
    image: rediscommander/redis-commander:latest
    container_name: finance_redis_ui
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - finance_net
    profiles:
      - tools                                   # only starts with: docker compose --profile tools up

  # ── Redis Insight (official Redis GUI) ───────────
  redis-insight:
    image: redis/redisinsight:latest
    container_name: finance_redis_insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    environment:
      - RI_APP_HOST=0.0.0.0
      - RI_APP_PORT=5540
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
    volumes:
      - redisinsight:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - finance_net
    profiles:
      - tools                                   # only starts with: docker compose --profile tools up

# ── Volumes ───────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  seq_data:
  prometheus_data:
  grafana_data:
  pgadmin_data:
  dotnet_cache:
  node_modules_cache:
  redisinsight:

# ── Network ───────────────────────────────────
networks:
  finance_net:
    driver: bridge
