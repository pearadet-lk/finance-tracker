name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend – Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: finance_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore backend/FinanceTracker.sln

      - name: Build
        run: dotnet build backend/FinanceTracker.sln --no-restore -c Release

      - name: Run unit tests
        run: dotnet test backend/tests/FinanceTracker.UnitTests --no-build -c Release --logger trx

      - name: Run integration tests
        run: dotnet test backend/tests/FinanceTracker.IntegrationTests --no-build -c Release --logger trx
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Database=finance_tracker_test;Username=admin;Password=password
          ConnectionStrings__Redis: localhost:6379
          Jwt__Secret: ci-test-secret-key-32-characters-min!!
          Jwt__Issuer: FinanceTracker
          Jwt__Audience: FinanceTrackerClient

  frontend:
    name: Frontend – Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t finance-tracker-api ./backend

      - name: Build frontend image
        run: docker build -t finance-tracker-frontend ./frontend
